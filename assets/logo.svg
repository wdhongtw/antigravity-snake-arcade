<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Snake Arcade">
  <defs>
    <linearGradient id="snakeHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="snakeBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="snakeTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Tail and lower body segments (inset ~11% margin) -->
  <g fill="url(#snakeTail)">
    <rect x="14" y="92" width="22" height="22" rx="6"/>
    <rect x="40" y="92" width="22" height="22" rx="6"/>
  </g>

  <!-- Middle S-curve segments -->
  <g fill="url(#snakeBody)">
    <rect x="66" y="92" width="22" height="22" rx="6"/>
    <rect x="66" y="66" width="22" height="22" rx="6"/>
    <rect x="40" y="66" width="22" height="22" rx="6"/>
    <rect x="40" y="40" width="22" height="22" rx="6"/>
  </g>

  <!-- Head segment facing right toward the apple -->
  <g fill="url(#snakeHead)">
    <rect x="66" y="40" width="22" height="22" rx="7"/>
  </g>

  <!-- Snake eyes -->
  <circle cx="81" cy="46" r="2.4" fill="#06281e"/>
  <circle cx="81" cy="56" r="2.4" fill="#06281e"/>
  <circle cx="81.6" cy="45.4" r="0.9" fill="#ecfdf5"/>
  <circle cx="81.6" cy="55.4" r="0.9" fill="#ecfdf5"/>

  <!-- Target Apple (top right) -->
  <g>
    <path d="M103 28 C105 22, 110 21, 112 23 C109 26, 106 28, 103 28 Z" fill="#34d399"/>
    <circle cx="103" cy="39" r="11" fill="url(#appleGrad)"/>
    <circle cx="99" cy="35" r="2.5" fill="#ffe4e6" opacity="0.65"/>
  </g>
</svg>
